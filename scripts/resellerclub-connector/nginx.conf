server {
    server_name connector.eazytool.app;
    client_max_body_size 16k;

    location ~ ^/v1/domains/(availability|price|status|nameservers|buyers/ensure|register|renew|dns/(list|create|update|remove))$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / { return 404; }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/connector.eazytool.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connector.eazytool.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name connector.eazytool.app;
    return 301 https://$host$request_uri;
}
